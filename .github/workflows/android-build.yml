name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and llama.kt submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Disable unavailable optional GPU backends in pinned llama.kt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("libs/llama.kt/llama-kt/src/main/cpp/CMakeLists.txt")
          text = path.read_text()

          # Remove individual OpenCL/Vulkan source, compile-definition and link entries.
          kept = []
          for line in text.splitlines(keepends=True):
              normalized = line.lower()
              if any(token in normalized for token in (
                  "ggml-opencl",
                  "ggml_opencl",
                  "ggml-opencl-sources",
                  "ggml_opencl_sources",
                  "opencl_lib",
                  "-lopencl",
                  "lm_ggml_use_opencl",
                  "ggml-vulkan",
                  "ggml_vulkan",
                  "vulkan_lib",
                  "lm_ggml_use_vulkan",
              )):
                  continue
              kept.append(line)

          path.write_text("".join(kept))

          # Also remove backend source references from any nearby CMake file that may
          # be included by the pinned upstream project.
          cpp_root = path.parent
          for cmake in cpp_root.rglob("CMakeLists.txt"):
              if cmake == path:
                  continue
              original = cmake.read_text()
              filtered = []
              for line in original.splitlines(keepends=True):
                  normalized = line.lower()
                  if any(token in normalized for token in (
                      "ggml-opencl",
                      "ggml_opencl",
                      "ggml-vulkan",
                      "ggml_vulkan",
                      "opencl_lib",
                      "-lopencl",
                      "lm_ggml_use_opencl",
                      "vulkan_lib",
                      "lm_ggml_use_vulkan",
                  )):
                      continue
                  filtered.append(line)
              updated = "".join(filtered)
              if updated != original:
                  cmake.write_text(updated)
          PY

      - name: Verify Gradle and Java versions
        run: |
          gradle --version
          java -version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ss-assistent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
