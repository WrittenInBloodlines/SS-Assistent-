name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and llama.kt submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Disable unavailable optional GPU backends in pinned llama.kt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("libs/llama.kt/llama-kt/src/main/cpp")
          cmake_files = list(root.rglob("CMakeLists.txt"))

          # Remove complete CMake commands/blocks, not individual lines. Removing
          # individual entries can leave a dangling ')' and break CMake parsing.
          block_patterns = [
              r"(?ms)^\\s*set\\(GGML_OPENCL_KERNELS\\b.*?^\\s*\\)\\s*\\n?",
              r"(?ms)^\\s*set\\(GGML_VULKAN_SOURCES\\b.*?^\\s*\\)\\s*\\n?",
              r"(?ms)^\\s*file\\(GLOB GGML_VULKAN_SHADER_SOURCES\\b.*?^\\s*\\)\\s*\\n?",
              r"(?ms)^\\s*find_library\\(VULKAN_LIB\\b.*?\\)\\s*\\n?",
          ]
          line_tokens = (
              "ggml-opencl", "ggml_opencl", "opencl_lib", "-lopencl",
              "lm_ggml_use_opencl", "ggml-vulkan", "ggml_vulkan",
              "vulkan_lib", "lm_ggml_use_vulkan",
          )

          for cmake in cmake_files:
              text = cmake.read_text()
              updated = text
              for pattern in block_patterns:
                  updated = re.sub(pattern, "", updated)

              kept = []
              for line in updated.splitlines(keepends=True):
                  normalized = line.lower()
                  if any(token in normalized for token in line_tokens):
                      continue
                  kept.append(line)
              updated = "".join(kept)

              if updated != text:
                  cmake.write_text(updated)
          PY

      - name: Verify Gradle and Java versions
        run: |
          gradle --version
          java -version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ss-assistent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
