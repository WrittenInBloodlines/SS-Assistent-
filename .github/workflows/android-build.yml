name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and llama.kt submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Disable unavailable optional GPU backends in pinned llama.kt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("libs/llama.kt/llama-kt/src/main/cpp/CMakeLists.txt")
          text = path.read_text()

          removals = [
              '    # Vulkan backend + SPIR-V shaders\n'
              '    ${GGML_VULKAN_SOURCES}\n'
              '    ${GGML_VULKAN_SHADER_SOURCES}\n',
              '    # Vulkan backend (Mali-G68 + any Vulkan 1.1+ GPU)\n'
              '    -DLM_GGML_USE_VULKAN\n',
              '    # Vulkan — Android system library (present on API 24+, always available on Mali devices)\n'
              '    ${VULKAN_LIB}\n',
              '    # OpenCL backend\n'
              '    ${GGML_OPENCL_SOURCES}\n',
              '    # OpenCL backend\n'
              '    -DLM_GGML_USE_OPENCL\n',
              '    # OpenCL — Android system library\n'
              '    -lOpenCL\n',
              '    ${OPENCL_LIB}\n',
          ]

          for block in removals:
              text = text.replace(block, '')

          text = text.replace('    ggml-opencl/ggml-opencl.cpp\n', '')
          text = text.replace('    ${GGML_OPENCL_SOURCES}\n', '')
          text = text.replace('    ${OPENCL_LIB}\n', '')
          text = text.replace('    -lOpenCL\n', '')
          text = text.replace('    OpenCL\n', '')
          path.write_text(text)
          PY

      - name: Verify Gradle and Java versions
        run: |
          gradle --version
          java -version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ss-assistent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
